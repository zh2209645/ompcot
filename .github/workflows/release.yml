name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (arm64) host build.
          - os: macos-latest
            updater_platform: darwin-aarch64
          # macOS Intel (x64) build. The macos-13 Intel runner was retired by
          # GitHub, so we cross-compile x86_64 from an Apple Silicon runner.
          - os: macos-14
            rust_target: x86_64-apple-darwin
            updater_platform: darwin-x86_64
          # Linux deb/rpm bundling is currently more stable on 22.04 than
          # 24.04 for GTK/WebKit bundles in CI.
          - os: ubuntu-22.04
            updater_platform: linux-x86_64
          - os: ubuntu-24.04-arm
            updater_platform: linux-aarch64
          - os: windows-2022
            updater_platform: windows-x86_64
          - os: windows-11-arm
            updater_platform: windows-aarch64

    runs-on: ${{ matrix.os }}

    env:
      # Mitigate intermittent crates.io download failures on CI runners
      # ("curl failed [16] Error in the HTTP2 framing layer"). Disabling
      # HTTP/2 multiplexing forces cargo's curl downloader back to HTTP/1.1,
      # which avoids the flaky HTTP2 framing-layer errors. The sparse
      # protocol + retries make transient registry hiccups self-healing.
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      CARGO_HTTP_CHECK_REVOKE: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # Cache the cargo registry + git db + target dir so successful crate
      # downloads survive across runs. This both speeds up builds and makes
      # transient crates.io download failures far less likely to break a
      # release (the crate is usually already on disk from a prior run).
      - name: Cache cargo + build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          WEBKIT_DEV_PKG="libwebkit2gtk-4.1-dev"
          if ! apt-cache show "$WEBKIT_DEV_PKG" >/dev/null 2>&1; then
            WEBKIT_DEV_PKG="libwebkit2gtk-4.0-dev"
          fi
          sudo apt-get install -y \
            desktop-file-utils \
            "$WEBKIT_DEV_PKG" \
            libappindicator3-dev \
            librsvg2-dev \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            rpm \
            patchelf

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build pi extensions bundle
        run: bun run build:extensions

      - name: Build Tauri app (Linux deb + rpm) and publish assets
        if: runner.os == 'Linux'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1
          # Workaround for linuxdeploy/strip failures on modern ELF
          # binaries (e.g. `.relr.dyn`), see tauri#14796.
          NO_STRIP: "true"
          # Signing key for the Tauri updater. Required so the bundler
          # produces `*.sig` files for the artifacts. Configure these
          # one-time in repo Settings → Secrets → Actions. See
          # docs/AUTO_UPDATER.md for how to generate the key pair.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Ompcot ${{ github.ref_name }}"
          releaseBody: |
            Automated release for `${{ github.ref_name }}`.
            Download the installer for your platform from the assets below.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --bundles deb,rpm
          # v0.7.2 incident follow-up: tauri-action's updater-JSON publisher
          # (includeUpdaterJson, which defaults to TRUE in v0) downloads the
          # existing latest.json, merges its own platforms in, DELETEs the
          # release asset and re-uploads it. With 6 concurrent matrix jobs
          # that delete can 404 (another job replaced the asset between our
          # read and our delete) and the whole step fails, dropping that
          # job's platforms from the manifest. So the action no longer
          # touches latest.json at all: every job uploads a uniquely named
          # fragment (see the next step) and the publish-updater-manifest
          # job below is the single writer of latest.json.
          includeUpdaterJson: false
          updaterJsonPreferNsis: true

      - name: Build Tauri app and publish assets
        if: runner.os != 'Linux'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing key for the Tauri updater. Required so the bundler
          # produces `*.sig` files for the artifacts. Configure these
          # one-time in repo Settings → Secrets → Actions. See
          # docs/AUTO_UPDATER.md for how to generate the key pair.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Ompcot ${{ github.ref_name }}"
          releaseBody: |
            Automated release for `${{ github.ref_name }}`.
            Download the installer for your platform from the assets below.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          # When a Rust target is set (Intel cross-build on an Apple Silicon
          # runner), pass it through so the bundler emits an x86_64 app.
          args: ${{ matrix.rust_target && format('--target {0}', matrix.rust_target) || '' }}
          # v0.7.2 incident follow-up: tauri-action's updater-JSON publisher
          # (includeUpdaterJson, which defaults to TRUE in v0) downloads the
          # existing latest.json, merges its own platforms in, DELETEs the
          # release asset and re-uploads it. With 6 concurrent matrix jobs
          # that delete can 404 (another job replaced the asset between our
          # read and our delete) and the whole step fails, dropping that
          # job's platforms from the manifest. So the action no longer
          # touches latest.json at all: every job uploads a uniquely named
          # fragment (see the next step) and the publish-updater-manifest
          # job below is the single writer of latest.json.
          includeUpdaterJson: false
          updaterJsonPreferNsis: true

      # Uploads this job's platform entries as a *uniquely named* fragment
      # asset (latest.<platform>.json). Unique names cannot collide across
      # the 6 concurrent matrix jobs, so there is no shared-asset race here;
      # --clobber only ever replaces this same job's own fragment on
      # workflow re-runs. shell: bash makes this portable across all
      # runners (on Windows the default would be pwsh).
      #
      # v0.7.3 incident constraints: GitHub macOS runners execute this with
      # the system /bin/bash 3.2 and BSD userland (no newer bash is
      # preinstalled on macos-* images), so the script must stay inside the
      # bash-3.2 + BSD/GNU-coreutils intersection:
      #   - NO mapfile/readarray (bash 4+ builtins; `mapfile: command not
      #     found` = exit 127 killed BOTH mac jobs in v0.7.3). Array
      #     building uses while-read loops instead.
      #   - no GNU-only flags (find -printf, stat -c, xargs -r, sed -z...).
      - name: Upload updater manifest fragment
        if: matrix.updater_platform != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATER_PLATFORM: ${{ matrix.updater_platform }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail

          : "${UPDATER_PLATFORM:?updater_platform missing from matrix entry}"
          TAG="$GITHUB_REF_NAME"

          # Cross-compiled builds (macos-14 x86_64) land under target/<triple>/.
          TARGET_DIR="src-tauri/target"
          if [ -n "$RUST_TARGET" ]; then
            TARGET_DIR="src-tauri/target/$RUST_TARGET"
          fi

          # Signature priority, mirroring tauri-action's updaterJsonPreferNsis
          # semantics: nsis (.exe.sig) beats msi, .app.tar.gz.sig is macOS'
          # only updater artifact (a .dmg is never an updater artifact and
          # the bundler writes no .sig next to it, so the recursive *.sig
          # discovery below naturally targets the .app.tar.gz + .sig pair),
          # deb beats rpm for the plain linux-<arch> key.
          sig_priority() {
            case "$1" in
              *.exe.sig | *.app.tar.gz.sig) echo 3 ;;
              *.deb.sig) echo 2 ;;
              *) echo 1 ;;
            esac
          }

          bundle_of() {
            case "$1" in
              *.app.tar.gz.sig) echo "app" ;;
              *.exe.sig) echo "nsis" ;;
              *.msi.sig) echo "msi" ;;
              *.deb.sig) echo "deb" ;;
              *.rpm.sig) echo "rpm" ;;
              *) echo "" ;;
            esac
          }

          # tauri-action renames the macOS updater artifacts with an arch
          # suffix when uploading: the on-disk bundle is Ompcot.app.tar.gz
          # for BOTH mac jobs, but the release assets are
          # Ompcot_aarch64.app.tar.gz (native arm64 build) and
          # Ompcot_x64.app.tar.gz (x86_64 cross build). v0.7.3's fragment
          # step looked up only the on-disk name, so `asset_url` failed on
          # macOS even though the assets existed. Translate the on-disk
          # artifact name into this job's expected release asset name; all
          # other platforms upload under their on-disk names unchanged.
          release_asset_name() {
            local name="$1" stem
            case "$name" in
              *.app.tar.gz)
                stem="${name%.app.tar.gz}"
                case "$RUST_TARGET $UPDATER_PLATFORM" in
                  *x86_64*) printf '%s_x64.app.tar.gz\n' "$stem" ;;
                  *aarch64* | *arm64*) printf '%s_aarch64.app.tar.gz\n' "$stem" ;;
                  *) printf '%s\n' "$name" ;;
                esac
                ;;
              *) printf '%s\n' "$name" ;;
            esac
          }

          # Browser download URL of an asset tauri-action uploaded moments
          # ago; retries while the lookup yields nothing, to ride out
          # release asset-list propagation. Tries the on-disk name first,
          # then the tauri-action-renamed macOS variant.
          asset_url() {
            local name="$1" renamed url candidate
            renamed="$(release_asset_name "$name")"
            for _ in 1 2 3; do
              for candidate in "$name" "$renamed"; do
                url="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
                  --jq ".assets | [.[] | select(.name == \"$candidate\") | .browser_download_url] | .[0] // empty" \
                  2>/dev/null || true)"
                if [ -n "$url" ]; then
                  printf '%s\n' "$url"
                  return 0
                fi
              done
              sleep 3
            done
            echo "::error::release asset '$name' (also looked for '$renamed') not found on release $TAG" >&2
            return 1
          }

          # Recursive find covers both target/release/bundle/... (host
          # builds, e.g. macos-latest arm64) and target/<triple>/release/
          # bundle/... (cross builds, e.g. macos-14 x86_64).
          SIGS=()
          while IFS= read -r sig; do
            SIGS+=("$sig")
          done < <(find "$TARGET_DIR/release/bundle" -type f -name '*.sig' 2>/dev/null | sort)
          if [ "${#SIGS[@]}" -eq 0 ]; then
            echo "::error::no updater signatures (*.sig) under $TARGET_DIR/release/bundle"
            exit 1
          fi

          # Highest priority first; -s keeps alphabetical order on ties.
          ORDERED=()
          while IFS= read -r sig; do
            ORDERED+=("$sig")
          done < <(
            for sig in "${SIGS[@]}"; do
              printf '%s %s\n' "$(sig_priority "$sig")" "$sig"
            done | sort -rn -s -k1,1 | cut -d' ' -f2-
          )

          VERSION="$(jq -r '.version' src-tauri/tauri.conf.json)"

          # Platforms for this fragment: the plain "<os>-<arch>" key from
          # the highest-priority signature plus "<os>-<arch>-<bundle>"
          # variant keys for every signature -- the same key set
          # tauri-action's includeUpdaterJson used to emit, so the
          # manifest shape is unchanged. This runs in the top-level shell
          # (NOT inside a command substitution) so that `set -e` makes a
          # failed asset lookup fail the whole step instead of silently
          # emitting a fragment with an empty url (command substitutions
          # do not inherit errexit).
          PLATFORMS="{}"
          first=1
          for sig in "${ORDERED[@]}"; do
            artifact="$(basename "$sig" .sig)"
            url="$(asset_url "$artifact")"
            entry="$(jq -cn --arg signature "$(cat "$sig")" --arg url "$url" \
              '{signature: $signature, url: $url}')"
            keys=("$UPDATER_PLATFORM")
            bundle="$(bundle_of "$sig")"
            if [ -n "$bundle" ]; then
              keys+=("$UPDATER_PLATFORM-$bundle")
            fi
            for key in "${keys[@]}"; do
              if [ "$key" != "$UPDATER_PLATFORM" ] || [ "$first" -eq 1 ]; then
                PLATFORMS="$(jq -cn --arg key "$key" --argjson entry "$entry" --argjson base "$PLATFORMS" \
                  '$base + {($key): $entry}')"
              fi
            done
            first=0
          done

          FRAGMENT="latest.$UPDATER_PLATFORM.json"
          jq -cn --arg version "$VERSION" --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --argjson platforms "$PLATFORMS" \
                '{version: $version, notes: "", pub_date: $pub_date, platforms: $platforms}' > "$FRAGMENT"

          echo "Uploading fragment $FRAGMENT:"
          cat "$FRAGMENT"

          gh release upload "$TAG" "$FRAGMENT" --clobber

  # Single writer for the shared updater manifest (latest.json). The build
  # matrix uploads uniquely named per-platform fragments; this job downloads
  # them fresh, merges them, and publishes latest.json exactly once -- there
  # are no concurrent writers, so the download -> merge -> DELETE -> re-upload
  # race that broke v0.7.2 (missing windows-x86_64 entries) cannot recur. The
  # publish itself is still an optimistic read-merge-publish loop with
  # jittered retries and a convergence check, to survive races with manual
  # manifest repairs or workflow re-runs.
  #
  # v0.7.3 incident follow-up: this job must run after the matrix EVEN WHEN
  # SOME MATRIX JOBS FAILED. The previous strict gate
  # (`needs.build-and-release.result == 'success'`) skipped the manifest on
  # any platform failure, so the already-created release became Latest with
  # NO latest.json and `releases/latest/download/latest.json` 404'd for
  # every existing client. The outcome is now selected inside the job:
  #   - all matrix jobs green      -> normal full publish (as before)
  #   - any failure, >=1 fragment  -> still publish a manifest from the
  #                                  fragments that DID upload, warn about
  #                                  the missing platforms, and fail the
  #                                  run in a FINAL step that runs AFTER
  #                                  the publish -- the run ends red but
  #                                  the endpoint is never left broken
  #   - any failure, 0 fragments   -> nothing to publish: fail loudly; the
  #                                  updater endpoint keeps serving the
  #                                  previously published manifest
  publish-updater-manifest:
    needs: build-and-release
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      # Mirror of the build-and-release matrix `updater_platform` values,
      # used to report which platforms are missing from a partial publish.
      # Keep in sync when editing the matrix above.
      EXPECTED_UPDATER_PLATFORMS: >-
        darwin-aarch64 darwin-x86_64 linux-x86_64 linux-aarch64
        windows-x86_64 windows-aarch64
    steps:
      - name: Merge fragments and publish latest.json (single writer, race-safe)
        id: publish
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX_RESULT: ${{ needs.build-and-release.result }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          TAG="$GITHUB_REF_NAME"

          release_json() {
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG"
          }

          asset_url() {
            release_json | jq -r ".assets[] | select(.name == \"$1\") | .url"
          }

          # Live manifest contents, or {} when the release has no latest.json yet.
          fetch_live_manifest() {
            local url
            url="$(release_json | jq -r '.assets[] | select(.name == "latest.json") | .url // empty')" || return 1
            if [ -z "$url" ]; then
              printf '{}\n'
            else
              gh api -H 'Accept: application/octet-stream' "$url" || return 1
            fi
          }

          fragment_names() {
            release_json | jq -r '.assets[].name' | grep -E '^latest\..+\.json$' || true
          }

          # 3-7.9 s randomized backoff.
          jitter() {
            printf '%s.%s' "$((RANDOM % 5 + 3))" "$((RANDOM % 10))"
          }

          # Updater platforms that currently have a fragment on the release.
          found_platforms() {
            local name p out=""
            for name in $(fragment_names); do
              p="${name#latest.}"
              out="$out ${p%.json}"
            done
            printf '%s' "${out# }"
          }

          # EXPECTED_UPDATER_PLATFORMS minus the platforms found in "$1".
          missing_platforms() {
            local found=" $1 " p missing=""
            for p in $EXPECTED_UPDATER_PLATFORMS; do
              case "$found" in
                *" $p "*) ;;
                *) missing="$missing $p" ;;
              esac
            done
            printf '%s' "${missing# }"
          }

          # Step outputs are best-effort so the script stays runnable
          # outside Actions (simulation harness) without GITHUB_OUTPUT.
          set_output() {
            if [ -n "${GITHUB_OUTPUT:-}" ]; then
              printf '%s\n' "$1" >> "$GITHUB_OUTPUT"
            fi
          }

          # Read-merge-publish with optimistic concurrency: every attempt
          # re-fetches the live manifest AND all fragments from the release
          # (never reusing a stale local copy), publishes with a single
          # overwriting upload (gh --clobber: delete+upload in one step that
          # also tolerates a missing asset -- no separate DELETE that can
          # 404 mid-race), then converges by re-reading the live manifest.
          # Fails only if some fragment's platform entries are still absent
          # after 5 attempts. Fragments are downloaded into a dedicated
          # subdirectory so the merge/convergence globs can never pick up
          # this job's own live.json/fresh.json/latest.json bookkeeping.
          publish_updater_manifest() {
            local workdir="$1"
            local attempt name version="" fv ok f
            for attempt in 1 2 3 4 5; do
              rm -rf "$workdir"
              mkdir -p "$workdir/fragments"

              # Fresh read of every input on every attempt.
              if ! fetch_live_manifest > "$workdir/live.json"; then
                echo "::warning::attempt $attempt: cannot read live latest.json, retrying"
                sleep "$(jitter)"
                continue
              fi
              for name in $(fragment_names); do
                if ! gh api -H 'Accept: application/octet-stream' "$(asset_url "$name")" \
                    > "$workdir/fragments/$name"; then
                  echo "::warning::attempt $attempt: cannot download fragment $name, retrying"
                  sleep "$(jitter)"
                  continue 2
                fi
              done

              # All fragments must describe the same app version.
              for f in "$workdir"/fragments/latest.*.json; do
                fv="$(jq -r '.version' "$f")"
                if [ -z "$version" ]; then
                  version="$fv"
                elif [ "$version" != "$fv" ]; then
                  echo "::error::fragment version mismatch ($version vs $fv in $(basename "$f"))"
                  return 1
                fi
              done
              if [ -z "$version" ]; then
                echo "::error::no latest.<platform>.json fragments found on release $TAG"
                return 1
              fi

              jq -s \
                --arg version "$version" \
                --arg notes "$(gh release view "$TAG" --json body --jq .body)" \
                --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                '{
                  version: $version,
                  notes: $notes,
                  pub_date: $pub_date,
                  platforms: ((.[0].platforms // {}) + (.[1:] | map(.platforms) | add // {}))
                }' "$workdir/live.json" "$workdir"/fragments/latest.*.json > "$workdir/latest.json"

              if ! gh release upload "$TAG" "$workdir/latest.json" --clobber; then
                echo "::warning::attempt $attempt: latest.json upload conflicted or failed, retrying with a fresh read"
                sleep "$(jitter)"
                continue
              fi

              # Convergence check: re-read the live manifest and require
              # every fragment's platform entries (key + signature + url)
              # to be present in it. Another writer may have carried them
              # (e.g. a manual repair); that still counts as success.
              if ! fetch_live_manifest > "$workdir/fresh.json"; then
                echo "::warning::attempt $attempt: cannot re-read live latest.json, retrying"
                sleep "$(jitter)"
                continue
              fi
              ok=1
              for f in "$workdir"/fragments/latest.*.json; do
                jq -e --slurpfile live "$workdir/fresh.json" '
                  .platforms as $want
                  | [ ($want | keys[]) as $k
                      | select( $live[0].platforms[$k] == null
                                or $live[0].platforms[$k] != $want[$k] ) ]
                  | length == 0
                ' "$f" > /dev/null || ok=0
              done
              if [ "$ok" -eq 1 ]; then
                echo "latest.json published and converged. Platforms:"
                jq -r '.platforms | keys[]' "$workdir/fresh.json"
                # Fragments were bookkeeping only; drop them from the
                # release page (single writer, so these deletes are safe;
                # a missing asset is ignored).
                for name in $(fragment_names); do
                  gh release delete-asset "$TAG" "$name" --yes || true
                done
                return 0
              fi
              echo "::warning::attempt $attempt: convergence check failed, retrying with a fresh read"
              sleep "$(jitter)"
            done
            echo "::error::latest.json did not converge after 5 attempts on release $TAG"
            return 1
          }

          FOUND="$(found_platforms)"

          # Zero fragments: nothing to merge, so nothing is published and
          # the job fails -- loudly so when the matrix already failed, since
          # the release page is missing its updater manifest entirely.
          if [ -z "$FOUND" ]; then
            echo "::error::no latest.<platform>.json fragments found on release $TAG (matrix result: '$MATRIX_RESULT')"
            if [ "$MATRIX_RESULT" != "success" ]; then
              echo "::error::nothing to merge, NOT publishing. The updater endpoint (releases/latest/download/latest.json) keeps serving the previously published manifest: existing clients keep working but will not be offered $TAG."
            fi
            exit 1
          fi

          publish_updater_manifest "$(mktemp -d)"

          # latest.json is published and converged; decide how the run ends.
          MISSING="$(missing_platforms "$FOUND")"
          if [ "$MATRIX_RESULT" != "success" ]; then
            # Partial publish: the endpoint is valid but incomplete. The
            # run must still end red; that failure is deferred to the final
            # step below so it can never preempt or mask the publish.
            echo "::warning::PARTIAL updater manifest published for $TAG (matrix result: '$MATRIX_RESULT'); platforms included: $FOUND"
            if [ -n "$MISSING" ]; then
              echo "::warning::updater platforms MISSING from latest.json: $MISSING"
            fi
            set_output "partial=true"
            set_output "missing=$MISSING"
          elif [ -n "$MISSING" ]; then
            echo "::warning::all matrix jobs succeeded but no fragment was uploaded for: $MISSING"
          fi

      # v0.7.3 incident follow-up: runs only AFTER a PARTIAL manifest was
      # successfully published. The manifest is already live, so failing
      # HERE (instead of inside the publish step) keeps
      # releases/latest/download/latest.json valid for every existing client
      # while the run is still marked red -- the exact inversion of the
      # v0.7.3 outcome (Latest release with no latest.json at all).
      - name: Mark run failed after partial manifest publish
        if: steps.publish.outputs.partial == 'true'
        shell: bash
        env:
          MISSING: ${{ steps.publish.outputs.missing }}
        run: |
          echo "::error::build matrix for $GITHUB_REF_NAME did not fully succeed"
          if [ -n "${MISSING:-}" ]; then
            echo "::error::latest.json was published WITHOUT updater entries for: $MISSING"
          else
            echo "::error::latest.json was published from every available fragment, but a matrix job still failed"
          fi
          echo "::error::clients on the missing platforms keep their current version until the failed matrix jobs are re-run"
          exit 1
