<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="bootstrap.windowTitle">Ompcot Startup</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101113;
      color: #e7e8ea;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    .card {
      width: min(680px, calc(100vw - 48px));
      border: 1px solid #2b2e33;
      border-radius: 14px;
      background: #16181c;
      padding: 24px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.32);
    }
    h1 { margin: 0 0 10px; font-size: 22px; }
    p { margin: 0 0 12px; color: #b7bdc8; line-height: 1.45; }
    .error {
      margin: 10px 0 16px;
      border-radius: 10px;
      border: 1px solid #3b2225;
      background: #231417;
      color: #ffb4bd;
      padding: 10px 12px;
      font-size: 12px;
      white-space: pre-wrap;
      display: none;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    button {
      border: 1px solid #2f3744;
      background: #1e2633;
      color: #dce6f8;
      border-radius: 9px;
      padding: 9px 14px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }
    .hint {
      margin-top: 10px;
      min-height: 18px;
      font-size: 12px;
      color: #8f98a8;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1 data-i18n="bootstrap.heading">Ompcot could not start</h1>
    <p data-i18n-html="bootstrap.embeddedFailed">The embedded <code>omp</code> runtime that ships with Ompcot failed to launch.</p>
    <p data-i18n-html="bootstrap.reinstallHint">This usually means the installation is incomplete or corrupted. Reinstalling Ompcot normally fixes it. Click <b>Retry startup</b> after reinstalling or rebooting.</p>
    <div id="startup-error" class="error"></div>
    <div class="actions">
      <button id="retry-btn" type="button" data-i18n="bootstrap.retry">Retry startup</button>
      <button id="pick-binary-btn" type="button" data-i18n="bootstrap.pickBinary">Specify omp binary path…</button>
    </div>
    <div id="hint" class="hint"></div>
  </main>
  <script type="module">
    import { applyTranslations, t } from './i18n.js';

    applyTranslations();

    const retryBtn = document.getElementById('retry-btn');
    const pickBinaryBtn = document.getElementById('pick-binary-btn');
    const hint = document.getElementById('hint');
    const errorBox = document.getElementById('startup-error');
    const rawError = new URLSearchParams(window.location.search).get('startupError');
    if (rawError) {
      errorBox.style.display = 'block';
      // URLSearchParams.get() already percent-decodes; decoding again would
      // throw on messages containing a decoded literal '%'.
      errorBox.textContent = rawError;
    }

    function getInvoke() {
      const invoke = window.__TAURI__?.core?.invoke;
      if (typeof invoke !== 'function') {
        hint.textContent = t('bootstrap.tauriUnavailable');
        return null;
      }
      return invoke;
    }

    async function retryStartup() {
      const invoke = getInvoke();
      if (!invoke) return;
      retryBtn.disabled = true;
      pickBinaryBtn.disabled = true;
      hint.textContent = t('bootstrap.startingRuntime');
      try {
        const port = await invoke('cmd_retry_startup');
        window.location.href = `http://localhost:${port}`;
      } catch (error) {
        hint.textContent = String(error?.message || error || t('bootstrap.startupFailed'));
        retryBtn.disabled = false;
        pickBinaryBtn.disabled = false;
      }
    }

    retryBtn.addEventListener('click', () => { void retryStartup(); });

    // Manual override for when no omp binary can be found: let the user pick
    // one. The backend validates + persists the choice, so an immediate retry
    // launches with the new path.
    pickBinaryBtn.addEventListener('click', async () => {
      const invoke = getInvoke();
      if (!invoke) return;
      pickBinaryBtn.disabled = true;
      try {
        const picked = await invoke('cmd_pick_omp_binary');
        if (picked) {
          hint.textContent = t('bootstrap.usingBinary', { path: picked });
          await retryStartup();
        }
        // picked == null → user cancelled the dialog; do nothing.
      } catch (error) {
        // The picked file was rejected (not a valid omp binary) — say why.
        errorBox.style.display = 'block';
        errorBox.textContent = String(error?.message || error || t('bootstrap.invalidBinary'));
      } finally {
        pickBinaryBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
